# Name der Dokumentationseinheit (möglichst ein Wort)
PROJECT_NAME          = "AVM Power"

# Von Doxygen einzulesende Dateien und Verzeichnisse (mit Leerzeichen getrennt)
INPUT                 = ./index.md ../include/avm/power/power.h

# Optionale Einstellungen

# Kurze Beschreibung der Dokumentationseinheit (möglichst eine Wortgruppe)
# PROJECT_BRIEF         =

# Pfad zu einem Logo
# PROJECT_LOGO          =

# Unterverzeichnisse rekursiv mit einbeziehen?
# RECURSIVE             = YES

# Auszunehmende Dateien und Verzeichnisse
# EXCLUDE               =

# Für C-Quellen optimierte Ausgabe
OPTIMIZE_OUTPUT_FOR_C = YES

# Dokumentationssprache
OUTPUT_LANGUAGE       = German

# Nicht annotierte Definitionen einbeziehen?
# EXTRACT_ALL           = YES

# Zeichenkodierung der Eingabedateien
# INPUT_ENCODING        = UTF-8

# Randleiste zur Navigation anzeigen?
# GENERATE_TREEVIEW     = YES

# Navigationsleiste (Reiter) ausblenden?
# DISABLE_INDEX         = YES
#
EXTRACT_STATIC = YES
EXCLUDE_SYMBOLS = _softirq_stat _runtime_stat 
PREDEFINED = __KERNEL__ CONFIG_AVM_POWERMETER CONFIG_AVM_POWER CONFIG_AVM_SOFTIRQ_STATISTIC
